<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening your application…</title>
<!--
  Why this page exists (Sept 6 2026):
  The GHL application form redirects to the Typeform by setting the TOP window's location
  from inside its iframe. That tears the iframe down before its own Meta pixel "Lead" can
  send, so Meta counted 1 Lead for 11 real GHL leads (Sept 2-5). The form's redirect URL
  now points HERE instead. This page is on manonmission.ca, fires Lead once with an event
  id, then forwards every query parameter it received on to the Typeform. The pixel inside
  the GHL form is switched off so each submission counts exactly once.
-->
<style>
  html,body{margin:0;height:100%;background:#F5F1E8;color:#2B2B2B;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
  main{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  p{margin:0;font-size:17px;line-height:1.5}
  a{color:#7B9E8E}
</style>
<script>
  // Nov 26 2026: the GHL form now hands over the man's name, email and phone in the part of
  // the address after "#", so the Typeform can fill its contact question in for him.
  // The "#" part never reaches our server. We copy it here and wipe it from the address
  // BEFORE the Meta pixel below loads, so his details are never sent to Meta.
  window.__moamHandoff = '';
  try {
    var h = window.location.hash || '';
    if (h.length > 1) {
      window.__moamHandoff = h.slice(1);
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  } catch (e) {}
</script>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1692779035222395');
fbq('track', 'PageView');
fbq('track', 'Lead', {}, { eventID: 'moam-app-' + Date.now() });
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1692779035222395&ev=Lead&noscript=1"/></noscript>
</head>
<body>
<main>
  <p>Opening your application…<br>
  <a id="go" href="https://form.typeform.com/to/vP787Q9P">Tap here if it doesn't open in a moment.</a></p>
</main>
<script>
  (function () {
    var target = 'https://form.typeform.com/to/vP787Q9P';
    var qs = window.location.search;
    if (qs && qs.length > 1) { target += qs; }
    // Pass his name, email and phone to the Typeform after "#" (never in the "?" part).
    // Only these four are passed. A raw "+" (phone "+1780…", plus-addressed emails) is kept
    // as a real plus sign. An unfilled tag ("{{contact.email}}") or a blank is skipped.
    try {
      var allowed = { first_name: 1, last_name: 1, email: 1, phone: 1 };
      var out = [];
      var parts = (window.__moamHandoff || '').split('&');
      for (var i = 0; i < parts.length; i++) {
        var eq = parts[i].indexOf('=');
        if (eq < 1) { continue; }
        var k = parts[i].slice(0, eq);
        var v = parts[i].slice(eq + 1).replace(/\+/g, '%2B');
        try { v = decodeURIComponent(v); } catch (e) {}
        v = v.replace(/^\s+|\s+$/g, '');
        if (!allowed[k] || !v || v.indexOf('{{') !== -1 || v === 'null' || v === 'undefined') { continue; }
        out.push(k + '=' + encodeURIComponent(v));
      }
      if (out.length) { target += '#' + out.join('&'); }
    } catch (e) {}
    document.getElementById('go').href = target;
    // Short hold so the Lead beacon is on its way before we leave.
    setTimeout(function () { window.location.replace(target); }, 400);
  })();
</script>
</body>
</html>
